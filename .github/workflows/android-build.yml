name: Android Build

# 手动触发,或推送到 main / master 时自动构建
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3
        with:
          # 默认会装已废弃的 "tools" 包导致失败;传空字符串跳过附加包,只保留 cmdline-tools
          packages: ''

      - name: 安装所需 SDK 组件 (compileSdk 37)
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "cmdline-tools;latest" "platform-tools" > /dev/null 2>&1 || true
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          # 平台必须装好:自定义的 compileHongguoCore 任务要用 android-37 的 android.jar。
          # 用 --channel=3 覆盖 stable/beta/dev/canary 所有通道,预览版平台也能拿到。
          if ! sdkmanager --channel=3 "platforms;android-37"; then
            echo "::error::所有通道都找不到 platforms;android-37。当前可安装的平台如下:"
            sdkmanager --list 2>/dev/null | grep -oE "platforms;android-[0-9A-Za-z]+" | sort -u -V || true
            exit 1
          fi
          sdkmanager --channel=3 "build-tools;37.0.0" || sdkmanager "build-tools;36.0.0" || true

      - name: 安装 Kotlin 编译器 (给 compileHongguoCore 用)
        run: |
          curl -L -o /tmp/kotlin-compiler.zip \
            https://github.com/JetBrains/kotlin/releases/download/v2.2.10/kotlin-compiler-2.2.10.zip
          unzip -q /tmp/kotlin-compiler.zip -d "$HOME/kotlin"
          echo "KOTLIN_HOME=$HOME/kotlin/kotlinc" >> "$GITHUB_ENV"

      - name: 构建 Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
