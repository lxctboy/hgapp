name: Android Build

# 手动触发,或推送到 master 时自动构建
on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装所需 SDK 组件 (compileSdk 37)
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          # 平台必须装好:自定义的 compileHongguoCore 任务要用 android-37 的 android.jar
          sdkmanager "platform-tools" "platforms;android-37"
          # build-tools 交给 AGP 自动下载;若已知版本存在则顺手装上,失败也不阻断
          sdkmanager "build-tools;37.0.0" || sdkmanager "build-tools;36.0.0" || true

      - name: 安装 Kotlin 编译器 (给 compileHongguoCore 用)
        run: |
          curl -L -o /tmp/kotlin-compiler.zip \
            https://github.com/JetBrains/kotlin/releases/download/v2.2.10/kotlin-compiler-2.2.10.zip
          unzip -q /tmp/kotlin-compiler.zip -d "$HOME/kotlin"
          echo "KOTLIN_HOME=$HOME/kotlin/kotlinc" >> "$GITHUB_ENV"

      - name: 构建 Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
