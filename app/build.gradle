plugins {
    id 'com.android.application'
}

def keystorePath = System.getenv('ANDROID_KEYSTORE')
def keystoreReady = keystorePath != null && !keystorePath.isEmpty()

// 判定密钥库格式:JKS 文件固定以魔数 0xFEEDFEED 开头,其余一律按 PKCS12 处理。
// 不能按扩展名判断 —— CI 会把还原出来的库写成 signing.keystore,扩展名与实际格式无关。
def keystoreFormat = { String path ->
    def file = new File(path)
    if (!file.exists() || file.length() < 4) return 'pkcs12'
    def head = new byte[4]
    file.withInputStream { it.read(head) }
    def isJks = (head[0] & 0xff) == 0xFE && (head[1] & 0xff) == 0xED &&
                (head[2] & 0xff) == 0xFE && (head[3] & 0xff) == 0xED
    return isJks ? 'jks' : 'pkcs12'
}
def keystoreType = keystoreReady ? keystoreFormat(keystorePath) : 'jks'

android {
    namespace 'com.huangguo.mobile'
    compileSdk 36

    defaultConfig {
        applicationId 'com.huangguo.mobile'
        minSdk 26
        targetSdk 36
        versionCode 48
        versionName '0.3.13'
        testInstrumentationRunner 'com.huangguo.mobile.PlaybackTestRunner'
    }

    // Install device regression tests beside the user's signed app, with separate local data.
    if (providers.gradleProperty('playbackQa').isPresent()) {
        buildTypes.debug.applicationIdSuffix = '.playbackqa'
    }

    signingConfigs {
        hongguo {
            if (keystoreReady) {
                def storePass = System.getenv('ANDROID_KEYSTORE_PASSWORD')
                storeFile file(keystorePath)
                storeType keystoreType
                storePassword storePass
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                // PKCS12 里没有独立的密钥口令,解锁密钥用的就是库口令;
                // 若照搬 JKS 习惯另设一个不同口令,打包会报 UnrecoverableKeyException。
                keyPassword keystoreType == 'pkcs12' ? storePass : System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }

    // 云端打包签名:CI 把 keystore 以 base64 存在 Secret 里,构建时还原成临时文件并把路径放进
    // ANDROID_KEYSTORE。Secret 没配时回退到 debug 签名,保证 assembleRelease 产出的包一定能装上
    // (未签名包会被系统以 INSTALL_PARSE_FAILED_NO_CERTIFICATES 直接拒掉)。
    buildTypes {
        release {
            signingConfig keystoreReady ? signingConfigs.hongguo : signingConfigs.debug
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

configurations { hongguoCompile }
def hongguoJar = layout.buildDirectory.file('libs/hongguo-core.jar')
def compileHongguo = tasks.register('compileHongguoCore', Exec) {
    inputs.files(fileTree('../third_party/hongguo/src') { include '**/*.kt' })
    inputs.file('../scripts/build-hongguo-core.py')
    outputs.file(hongguoJar)
    doFirst {
        def sdkPath = System.getenv('ANDROID_HOME') ?: System.getenv('ANDROID_SDK_ROOT') ?: "${System.getenv('LOCALAPPDATA')}/Android/Sdk"
        // 跟随 compileSdk,避免平台版本与 SDK 配置脱节
        def api = android.compileSdk
        def platform = file("${sdkPath}/platforms/android-${api}/android.jar")
        if (!platform.exists()) platform = file("${sdkPath}/platforms/android-${api}.0/android.jar")
        commandLine 'python', '-X', 'utf8', file('../scripts/build-hongguo-core.py'),
                '--classpath', (configurations.hongguoCompile.files + [platform]).collect { it.absolutePath }.join(File.pathSeparator),
                '--output', hongguoJar.get().asFile.absolutePath
    }
}

dependencies {
    hongguoCompile('com.squareup.okhttp3:okhttp:4.10.0') { transitive = false }
    hongguoCompile('com.squareup.okio:okio-jvm:3.0.0') { transitive = false }
    hongguoCompile('org.bouncycastle:bcprov-jdk18on:1.80.2') { transitive = false }
    hongguoCompile('org.jsoup:jsoup:1.23.2') { transitive = false }
    hongguoCompile('org.jetbrains.kotlin:kotlin-stdlib:2.2.10') { transitive = false }
    implementation files(hongguoJar).builtBy(compileHongguo)
    implementation 'com.squareup.okhttp3:okhttp:4.10.0'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.80.2'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.2.10'
    implementation 'androidx.webkit:webkit:1.17.1'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'junit:junit:4.13.2'
    implementation 'androidx.core:core:1.7.0'
    implementation 'com.github.parse-community.Parse-SDK-Android:parse:4.4.0'
    implementation 'org.jsoup:jsoup:1.23.2'
    implementation 'androidx.media3:media3-exoplayer:1.11.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.11.1'
    implementation 'androidx.media3:media3-ui:1.11.1'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs_nio:2.0.1'
}
